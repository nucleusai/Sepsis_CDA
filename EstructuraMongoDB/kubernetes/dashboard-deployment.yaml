apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: saosj/dashboardsl:v3
          ports:
            - containerPort: 8050
          env:
          - name: HOST_BD
            value: "mongodb-container"
          - name: HOST_BD_PORT
            value: "27017"
          - name: HOST_AI_MODEL
            value: "aisepsis"
          - name : HOST_AI_MODEL_PORT
            value: "8000"
